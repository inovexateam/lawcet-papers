let currentPart = 'A';
let score = {A:{right:0,total:0},B:{right:0,total:0},C:{right:0,total:0}};
let answered = {};

function switchPart(part) {
  currentPart = part;
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const parts=['A','B','C'];
    t.classList.toggle('active', parts[i]===part);
  });
  render();
}

function render() {
  const d = data[currentPart];
  let html = `<div class="part-info"><strong>${d.info}</strong></div>`;
  d.questions.forEach((q,i)=>{
    const key = currentPart+'-'+i;
    const isAnswered = answered[key] !== undefined;
    html += `<div class="q-card">
      <div class="q-num">Q${i+1} of ${d.questions.length}</div>
      <div class="q-text">${q.q}</div>
      <div class="opts">`;
    q.opts.forEach((o,j)=>{
      let cls = 'opt';
      if(isAnswered){
        if(j===q.ans) cls+=' correct';
        else if(j===answered[key] && j!==q.ans) cls+=' wrong';
      }
      html+=`<div class="${cls}" onclick="pick('${key}',${j},${q.ans},'${currentPart}')">${String.fromCharCode(65+j)}. ${o}</div>`;
    });
    html+=`</div>`;
    if(isAnswered){
      html+=`<div class="ans-block show">
        <div class="ans-label">✓ Answer: ${q.opts[q.ans]}</div>
        <div class="ans-exp">${q.exp}</div>
        <div class="mnemonic"><div class="mnemonic-title">Memory Tip / Coaching Technique</div>${q.mem}</div>
      </div>`;
    } else {
      html+=`<button class="toggle-btn" onclick="showAns('${key}')">Show answer & explanation</button>`;
    }
    html+='</div>';
  });
  document.getElementById('part-container').innerHTML = html;
  updateScore();
}

function pick(key, chosen, correct, part) {
  if(answered[key]!==undefined) return;
  answered[key] = chosen;
  if(chosen===correct) score[part].right++;
  score[part].total++;
  render();
}

function showAns(key) {
  if(answered[key]===undefined){
    const parts = key.split('-');
    const part = parts[0];
    const idx = parseInt(parts[1]);
    answered[key] = -1;
    score[part].total++;
  }
  render();
}

function updateScore() {
  let totalRight=0, totalAnswered=0;
  ['A','B','C'].forEach(p=>{totalRight+=score[p].right;totalAnswered+=score[p].total;});
  document.getElementById('score-display').textContent = totalRight+'/'+totalAnswered;
}

render();
</script>
